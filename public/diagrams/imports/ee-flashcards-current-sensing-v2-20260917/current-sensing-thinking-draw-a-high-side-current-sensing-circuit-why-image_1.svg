<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490" role="img" aria-label="Current-shunt resistance tradeoff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"></path>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"></path>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"></path>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"></path>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0ea5a5"></path>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"></path>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"></path>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"></rect>
  <text x="430" y="38" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Current-shunt resistance tradeoff</text>

    <text x="80" y="155" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start">VIN</text>
    <line x1="115" y1="150" x2="190" y2="150" stroke="#111827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"></line>

    <line x1="190" y1="150" x2="279" y2="150" stroke="#111827" stroke-width="2" stroke-linecap="round"></line>
    <rect x="279" y="140" width="62" height="20" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="3"></rect>
    <line x1="341" y1="150" x2="430" y2="150" stroke="#111827" stroke-width="2" stroke-linecap="round"></line>
    <text x="310" y="126" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">RSHUNT</text>

    <line x1="430" y1="150" x2="500" y2="150" stroke="#111827" stroke-width="3" stroke-linecap="round"></line>
    <rect x="500" y="118" width="96" height="64" rx="1" fill="#f8fafc" stroke="#111827" stroke-width="2"></rect><text x="548" y="155" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">LOAD</text><line x1="596" y1="150" x2="640" y2="150" stroke="#111827" stroke-width="2" stroke-linecap="round"></line>
    <line x1="640" y1="150" x2="640" y2="158" stroke="#111827" stroke-width="2" stroke-linecap="round"></line>
    <path d="M628 158 L640 172 L652 158 Z" fill="none" stroke="#111827" stroke-width="2"></path>

    <path d="M210 150 V284 H368" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M410 150 V190 H180 V332 H368" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>

    <path d="M368 260 L368 356 L492 308 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5"></path>
    <text x="386" y="289" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">-</text>
    <text x="386" y="338" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">+</text>
    <text x="428" y="313" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CSA</text>

    <line x1="492" y1="308" x2="610" y2="308" stroke="#0f766e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"></line>
    <text x="600" y="292" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="end">VOUT</text>
    <text x="220" y="228" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" transform="translate(104.9 -6.8)">VSHUNT = I × RSHUNT</text>

    <text x="210" y="380" fill="#b45309" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">TOO SMALL</text>
    <text x="210" y="404" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">signal approaches offset + noise</text>
    <text x="650" y="380" fill="#dc2626" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">TOO LARGE</text>
    <text x="650" y="404" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">I²R heat + load voltage loss</text>
    <path d="M302 436 H558" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="430" y="462" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Choose enough signal margin without excessive dissipation</text>

</svg>
