    <line x1="370" y1="145" x2="432" y2="145" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"></line>
    <text x="646" y="252" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">H</text>
