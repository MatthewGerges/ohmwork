  <rect width="100%" height="100%" rx="18" fill="#0f172a"></rect>
  <text x="370" y="42" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">B-H magnetic hysteresis curve</text>
  
    <line x1="88" y1="230" x2="662" y2="230" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></line>
    <line x1="370" y1="354" x2="370" y2="82" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></line>
    <path d="M108 326 C174 326 226 312 282 270 C326 238 342 185 370 145 C404 98 474 96 632 96 C554 96 480 109 432 146 C395 175 390 216 370 230 C338 251 302 272 270 295 C226 326 168 326 108 326 Z" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
