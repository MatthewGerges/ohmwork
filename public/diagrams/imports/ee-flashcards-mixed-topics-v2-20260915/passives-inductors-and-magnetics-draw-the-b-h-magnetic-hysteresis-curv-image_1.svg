    <text x="606" y="78" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">+ saturation</text>
    <text x="134" y="352" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">- saturation</text>
    <text x="442" y="140" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" transform="translate(2.2 15.4)">remanence Br</text>
    <text x="238" y="218" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">-Hc</text>
    <text x="370" y="390" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Loop area represents hysteresis energy loss per cycle</text>
  
