    <text x="202" y="267" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">RX</text>
  
    
    <rect x="470" y="96" width="210" height="220" rx="8" fill="#111c31" stroke="#475569" stroke-width="2"></rect>
    <text x="575" y="130" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Device 2</text>
    <rect x="506" y="168" width="64" height="42" rx="5" fill="#173a52" stroke="#818cf8" stroke-width="2"></rect>
    <text x="538" y="195" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">TX</text>
