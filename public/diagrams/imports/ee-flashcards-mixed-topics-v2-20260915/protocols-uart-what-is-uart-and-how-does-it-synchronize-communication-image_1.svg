    <text x="612" y="267" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">RX</text>
  
    <path d="M160 189 H340 V281 H560 V261 H570" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"></path>
    <path d="M570 256 L580 261 L570 266 Z" fill="#818cf8" stroke="#818cf8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M506 189 H400 V241 H254 V261 H244" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"></path>
