  <rect width="100%" height="100%" rx="18" fill="#0f172a"></rect>
  <text x="370" y="42" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">UART crossover wiring</text>
  
    
