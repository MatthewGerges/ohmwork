    <text x="472" y="181" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" transform="translate(-45.7 -3.9)">TX2 -&gt; RX1</text>
    <text x="370" y="342" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">No clock wire: both ends use the same baud rate</text>
