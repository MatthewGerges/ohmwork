    <text x="165" y="130" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Device 1</text>
    <rect x="96" y="168" width="64" height="42" rx="5" fill="#173a52" stroke="#818cf8" stroke-width="2"></rect>
    <text x="128" y="195" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">TX</text>
