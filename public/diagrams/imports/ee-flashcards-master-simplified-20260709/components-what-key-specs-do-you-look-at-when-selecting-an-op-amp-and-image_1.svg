<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" aria-label="Op-amp selection matrix">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="18" fill="#0f172a"/>
  <text x="350" y="42" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Op-amp selection matrix</text>
  
    <rect x="58" y="92" width="584" height="202" rx="8" fill="#111c31" stroke="#475569" stroke-width="2"/>
    <line x1="58" y1="142" x2="642" y2="142" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="196" x2="642" y2="196" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="242" y1="92" x2="242" y2="294" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="442" y1="92" x2="442" y2="294" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="122" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Category</text>
    <text x="342" y="122" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Precision</text>
    <text x="542" y="122" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">High-speed</text>
    <text x="150" y="174" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Offset / bias</text>
    <text x="342" y="174" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">low Vos, low Ib</text>
    <text x="542" y="174" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">often higher</text>
    <text x="150" y="230" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Speed</text>
    <text x="342" y="230" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">low GBWP / SR</text>
    <text x="542" y="230" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">high GBWP / SR</text>
    <text x="350" y="326" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Pick the op-amp for the signal, not just the pinout.</text>
  
</svg>
