  <rect width="100%" height="100%" rx="18" fill="#0f172a"></rect>
  <text x="450" y="42" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Buck converter without a freewheeling diode</text>


    <rect x="40" y="96" width="390" height="232" rx="6" fill="#0b1528" stroke="#475569" stroke-width="2"></rect>
    <text x="235" y="122" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">WITH FREEWHEEL DIODE</text>
