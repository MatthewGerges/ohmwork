    <text x="88" y="201" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Vin</text>
    <line x1="432" y1="184" x2="622" y2="184" stroke="#4ade80" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
