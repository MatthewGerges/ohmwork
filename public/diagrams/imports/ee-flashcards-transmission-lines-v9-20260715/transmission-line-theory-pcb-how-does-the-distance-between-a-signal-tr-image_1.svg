    <text x="194" y="324" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">small d = high C</text>
    <rect x="404" y="126" width="244" height="176" rx="8" fill="#111c31" stroke="#fbbf24" stroke-width="2"/>
    <rect x="458" y="148" width="136" height="24" rx="4" fill="#fb923c" stroke="#fbbf24" stroke-width="2"/>
