  <rect width="100%" height="100%" rx="18" fill="#0f172a"/>
  <text x="360" y="42" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Trace-to-plane capacitance</text>
  
    <text x="360" y="92" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">C = εA / d</text>
    <rect x="72" y="126" width="244" height="176" rx="8" fill="#111c31" stroke="#818cf8" stroke-width="2"/>
    <rect x="126" y="154" width="136" height="24" rx="4" fill="#fb923c" stroke="#fbbf24" stroke-width="2"/>
