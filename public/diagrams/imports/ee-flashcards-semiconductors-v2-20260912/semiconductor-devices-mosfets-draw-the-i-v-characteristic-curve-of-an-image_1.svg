<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="MOSFET output characteristics">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"></path>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2dd4bf"></path>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171"></path>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#818cf8"></path>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"></path>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"></path>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="18" fill="#0f172a"></rect>
  <text x="360" y="42" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">MOSFET output characteristics</text>

    <rect x="64" y="82" width="596" height="268" rx="8" fill="#111c31" stroke="#475569" stroke-width="2"></rect>
    <line x1="118" y1="270" x2="624" y2="270" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></line>
    <line x1="118" y1="270" x2="118" y2="106" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></line>

    <path d="M124 270 C160 264 190 256 284 238 C390 238 494 238 590 238" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="596" y="242" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">VGS = 3 V</text>

    <path d="M124 270 C160 264 190 226 284 208 C390 206 494 204 590 202" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="596" y="206" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">VGS = 4 V</text>

    <path d="M124 270 C160 264 190 194 284 176 C390 172 494 168 590 164" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="596" y="168" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">VGS = 5 V</text>

    <path d="M124 270 C160 264 190 160 284 142 C390 136 494 130 590 124" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="596" y="128" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">VGS = 6 V</text>

    <path d="M126 265 L586 265" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(2.1 5.5)"></path>
    <line x1="220" y1="320" x2="160" y2="270" stroke="#818cf8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)" transform="translate(58.5 5.8)"></line>
    <path d="M148 258 C190 224 228 174 270 112" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path>
    <text x="188" y="120" fill="#f87171" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Triode / Ohmic</text>
    <text x="448" y="118" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Saturation</text>
    <text x="430" y="294" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">VDS (drain-to-source voltage)</text>
    <text x="78" y="190" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">ID</text>
    <text x="220" y="340" fill="#818cf8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Cutoff: VGS &lt; VTH, so ID = 0</text>

</svg>
