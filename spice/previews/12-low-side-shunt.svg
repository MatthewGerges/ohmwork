<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="white"/><text x="64" y="45" font-family="Arial" font-size="24" fill="#17212b">Low-side current sensing: shunt trade-off</text><line x1="128" y1="304" x2="128" y2="336" stroke="#244b83" stroke-width="2"/><line x1="128" y1="416" x2="128" y2="448" stroke="#244b83" stroke-width="2"/><line x1="128" y1="304" x2="128" y2="144" stroke="#244b83" stroke-width="2"/><line x1="128" y1="144" x2="576" y2="144" stroke="#244b83" stroke-width="2"/><line x1="576" y1="224" x2="576" y2="304" stroke="#244b83" stroke-width="2"/><line x1="576" y1="272" x2="832" y2="272" stroke="#244b83" stroke-width="2"/><line x1="576" y1="384" x2="576" y2="448" stroke="#244b83" stroke-width="2"/><line x1="120" y1="356" x2="136" y2="356" stroke="#17212b" stroke-width="2"/><line x1="120" y1="396" x2="136" y2="396" stroke="#17212b" stroke-width="2"/><line x1="128" y1="348" x2="128" y2="364" stroke="#17212b" stroke-width="2"/><line x1="128" y1="416" x2="128" y2="408" stroke="#17212b" stroke-width="2"/><line x1="128" y1="336" x2="128" y2="344" stroke="#17212b" stroke-width="2"/><circle cx="128" cy="376" r="32" fill="none" stroke="#17212b" stroke-width="2"/><text x="170" y="358" text-anchor="start" font-family="Arial" font-size="18">V1</text><text x="170" y="386" text-anchor="start" font-family="Arial" font-size="18">12</text><line x1="576" y1="216" x2="576" y2="224" stroke="#17212b" stroke-width="2"/><line x1="560" y1="208" x2="576" y2="216" stroke="#17212b" stroke-width="2"/><line x1="592" y1="192" x2="560" y2="208" stroke="#17212b" stroke-width="2"/><line x1="560" y1="176" x2="592" y2="192" stroke="#17212b" stroke-width="2"/><line x1="592" y1="160" x2="560" y2="176" stroke="#17212b" stroke-width="2"/><line x1="576" y1="144" x2="576" y2="152" stroke="#17212b" stroke-width="2"/><line x1="576" y1="152" x2="592" y2="160" stroke="#17212b" stroke-width="2"/><text x="618" y="166" text-anchor="start" font-family="Arial" font-size="18">RLOAD</text><text x="618" y="194" text-anchor="start" font-family="Arial" font-size="18">100</text><line x1="576" y1="376" x2="576" y2="384" stroke="#17212b" stroke-width="2"/><line x1="560" y1="368" x2="576" y2="376" stroke="#17212b" stroke-width="2"/><line x1="592" y1="352" x2="560" y2="368" stroke="#17212b" stroke-width="2"/><line x1="560" y1="336" x2="592" y2="352" stroke="#17212b" stroke-width="2"/><line x1="592" y1="320" x2="560" y2="336" stroke="#17212b" stroke-width="2"/><line x1="576" y1="304" x2="576" y2="312" stroke="#17212b" stroke-width="2"/><line x1="576" y1="312" x2="592" y2="320" stroke="#17212b" stroke-width="2"/><text x="618" y="326" text-anchor="start" font-family="Arial" font-size="18">RSHUNT</text><text x="618" y="354" text-anchor="start" font-family="Arial" font-size="18">1</text><text x="128" y="292" font-family="Arial" font-size="18" fill="#244b83">VIN</text><line x1="116" y1="448" x2="140" y2="448" stroke="#244b83" stroke-width="2"/><line x1="120" y1="453" x2="136" y2="453" stroke="#244b83" stroke-width="2"/><line x1="124" y1="458" x2="132" y2="458" stroke="#244b83" stroke-width="2"/><text x="832" y="260" font-family="Arial" font-size="18" fill="#244b83">VSENSE</text><line x1="564" y1="448" x2="588" y2="448" stroke="#244b83" stroke-width="2"/><line x1="568" y1="453" x2="584" y2="453" stroke="#244b83" stroke-width="2"/><line x1="572" y1="458" x2="580" y2="458" stroke="#244b83" stroke-width="2"/><text x="64" y="672" font-family="Arial" font-size="18">.tran 0 1m 0 1u</text><text x="64" y="720" font-family="Arial" font-size="18">I = 12/(100+1) = 118.8 mA. VSENSE = I*RSHUNT = 118.8 mV.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled VSENSE (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Click the VIN wire too, to compare input and output in the same plot.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">TRY: Change RSHUNT from 1 to 0.1 ohm. Sense voltage falls by 10x.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">Probe VSENSE; hover over RSHUNT and click to see current.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">FAQ: Larger shunts improve voltage signal but waste more power: P = I^2*R.</text><text x="64" y="1184" font-family="Arial" font-size="18" fill="#17212b">TRY: Reduce RLOAD. Current and shunt dissipation both increase.</text></svg>