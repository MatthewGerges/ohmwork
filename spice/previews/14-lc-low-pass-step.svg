<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="white"/><text x="64" y="45" font-family="Arial" font-size="24" fill="#17212b">LC low-pass: step response</text><line x1="128" y1="208" x2="128" y2="240" stroke="#244b83" stroke-width="2"/><line x1="128" y1="320" x2="128" y2="352" stroke="#244b83" stroke-width="2"/><line x1="128" y1="208" x2="128" y2="144" stroke="#244b83" stroke-width="2"/><line x1="128" y1="144" x2="320" y2="144" stroke="#244b83" stroke-width="2"/><line x1="400" y1="144" x2="768" y2="144" stroke="#244b83" stroke-width="2"/><line x1="576" y1="144" x2="576" y2="272" stroke="#244b83" stroke-width="2"/><line x1="576" y1="336" x2="576" y2="416" stroke="#244b83" stroke-width="2"/><line x1="768" y1="144" x2="768" y2="272" stroke="#244b83" stroke-width="2"/><line x1="768" y1="352" x2="768" y2="416" stroke="#244b83" stroke-width="2"/><line x1="120" y1="260" x2="136" y2="260" stroke="#17212b" stroke-width="2"/><line x1="120" y1="300" x2="136" y2="300" stroke="#17212b" stroke-width="2"/><line x1="128" y1="252" x2="128" y2="268" stroke="#17212b" stroke-width="2"/><line x1="128" y1="320" x2="128" y2="312" stroke="#17212b" stroke-width="2"/><line x1="128" y1="240" x2="128" y2="248" stroke="#17212b" stroke-width="2"/><circle cx="128" cy="280" r="32" fill="none" stroke="#17212b" stroke-width="2"/><text x="170" y="262" text-anchor="start" font-family="Arial" font-size="18">V1</text><text x="170" y="290" text-anchor="start" font-family="Arial" font-size="18">PULSE(0 1 100u 1u 1u 10m 20m)</text><path d="M348.68629150101526 132.68629150101523 A16 16 0 1 1 371.31370849898474 132.68629150101523" fill="none" stroke="#17212b" stroke-width="2"/><path d="M320 144 A16 16 0 1 1 347.31370849898474 132.68629150101523" fill="none" stroke="#17212b" stroke-width="2"/><path d="M372.68629150101526 132.68629150101523 A16 16 0 1 1 400 144" fill="none" stroke="#17212b" stroke-width="2"/><text x="360" y="96" text-anchor="middle" font-family="Arial" font-size="18">L1</text><text x="360" y="186" text-anchor="middle" font-family="Arial" font-size="18">1m</text><line x1="576" y1="308" x2="576" y2="336" stroke="#17212b" stroke-width="2"/><line x1="576" y1="300" x2="576" y2="272" stroke="#17212b" stroke-width="2"/><line x1="560" y1="300" x2="592" y2="300" stroke="#17212b" stroke-width="2"/><line x1="560" y1="308" x2="592" y2="308" stroke="#17212b" stroke-width="2"/><text x="618" y="294" text-anchor="start" font-family="Arial" font-size="18">C1</text><text x="618" y="322" text-anchor="start" font-family="Arial" font-size="18">1u</text><line x1="768" y1="344" x2="768" y2="352" stroke="#17212b" stroke-width="2"/><line x1="752" y1="336" x2="768" y2="344" stroke="#17212b" stroke-width="2"/><line x1="784" y1="320" x2="752" y2="336" stroke="#17212b" stroke-width="2"/><line x1="752" y1="304" x2="784" y2="320" stroke="#17212b" stroke-width="2"/><line x1="784" y1="288" x2="752" y2="304" stroke="#17212b" stroke-width="2"/><line x1="768" y1="272" x2="768" y2="280" stroke="#17212b" stroke-width="2"/><line x1="768" y1="280" x2="784" y2="288" stroke="#17212b" stroke-width="2"/><text x="810" y="294" text-anchor="start" font-family="Arial" font-size="18">RLOAD</text><text x="810" y="322" text-anchor="start" font-family="Arial" font-size="18">100</text><text x="128" y="196" font-family="Arial" font-size="18" fill="#244b83">VIN</text><line x1="116" y1="352" x2="140" y2="352" stroke="#244b83" stroke-width="2"/><line x1="120" y1="357" x2="136" y2="357" stroke="#244b83" stroke-width="2"/><line x1="124" y1="362" x2="132" y2="362" stroke="#244b83" stroke-width="2"/><line x1="564" y1="416" x2="588" y2="416" stroke="#244b83" stroke-width="2"/><line x1="568" y1="421" x2="584" y2="421" stroke="#244b83" stroke-width="2"/><line x1="572" y1="426" x2="580" y2="426" stroke="#244b83" stroke-width="2"/><text x="768" y="132" font-family="Arial" font-size="18" fill="#244b83">VOUT</text><line x1="756" y1="416" x2="780" y2="416" stroke="#244b83" stroke-width="2"/><line x1="760" y1="421" x2="776" y2="421" stroke="#244b83" stroke-width="2"/><line x1="764" y1="426" x2="772" y2="426" stroke="#244b83" stroke-width="2"/><text x="64" y="672" font-family="Arial" font-size="18">.tran 0 1.2m 0 500n</text><text x="64" y="720" font-family="Arial" font-size="18">VIN is a 0 to 1 V step. L and C set the natural frequency near 5.03 kHz.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled VOUT (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Click the VIN wire too, to compare input and output in the same plot.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">PLOT: VOUT starts near 0 V, overshoots 1 V, then settles to 1 V.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">TRY: Reduce RLOAD to 20 ohms. A heavier load damps the ringing.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">The same underdamped poles produce peaking in the AC sweep.</text></svg>