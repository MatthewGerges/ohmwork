<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="white"/><text x="64" y="45" font-family="Arial" font-size="24" fill="#17212b">Voltage divider: loading error</text><line x1="128" y1="304" x2="128" y2="336" stroke="#244b83" stroke-width="2"/><line x1="128" y1="416" x2="128" y2="448" stroke="#244b83" stroke-width="2"/><line x1="128" y1="304" x2="128" y2="144" stroke="#244b83" stroke-width="2"/><line x1="128" y1="144" x2="400" y2="144" stroke="#244b83" stroke-width="2"/><line x1="480" y1="144" x2="832" y2="144" stroke="#244b83" stroke-width="2"/><line x1="576" y1="144" x2="576" y2="336" stroke="#244b83" stroke-width="2"/><line x1="576" y1="416" x2="576" y2="464" stroke="#244b83" stroke-width="2"/><line x1="832" y1="144" x2="832" y2="336" stroke="#244b83" stroke-width="2"/><line x1="832" y1="416" x2="832" y2="464" stroke="#244b83" stroke-width="2"/><line x1="120" y1="356" x2="136" y2="356" stroke="#17212b" stroke-width="2"/><line x1="120" y1="396" x2="136" y2="396" stroke="#17212b" stroke-width="2"/><line x1="128" y1="348" x2="128" y2="364" stroke="#17212b" stroke-width="2"/><line x1="128" y1="416" x2="128" y2="408" stroke="#17212b" stroke-width="2"/><line x1="128" y1="336" x2="128" y2="344" stroke="#17212b" stroke-width="2"/><circle cx="128" cy="376" r="32" fill="none" stroke="#17212b" stroke-width="2"/><text x="170" y="358" text-anchor="start" font-family="Arial" font-size="18">V1</text><text x="170" y="386" text-anchor="start" font-family="Arial" font-size="18">5</text><line x1="408" y1="144" x2="400" y2="144" stroke="#17212b" stroke-width="2"/><line x1="416" y1="128" x2="408" y2="144" stroke="#17212b" stroke-width="2"/><line x1="432" y1="160" x2="416" y2="128" stroke="#17212b" stroke-width="2"/><line x1="448" y1="128" x2="432" y2="160" stroke="#17212b" stroke-width="2"/><line x1="464" y1="160" x2="448" y2="128" stroke="#17212b" stroke-width="2"/><line x1="480" y1="144" x2="472" y2="144" stroke="#17212b" stroke-width="2"/><line x1="472" y1="144" x2="464" y2="160" stroke="#17212b" stroke-width="2"/><text x="440" y="116" text-anchor="middle" font-family="Arial" font-size="18">R1</text><text x="440" y="186" text-anchor="middle" font-family="Arial" font-size="18">10k</text><line x1="576" y1="408" x2="576" y2="416" stroke="#17212b" stroke-width="2"/><line x1="560" y1="400" x2="576" y2="408" stroke="#17212b" stroke-width="2"/><line x1="592" y1="384" x2="560" y2="400" stroke="#17212b" stroke-width="2"/><line x1="560" y1="368" x2="592" y2="384" stroke="#17212b" stroke-width="2"/><line x1="592" y1="352" x2="560" y2="368" stroke="#17212b" stroke-width="2"/><line x1="576" y1="336" x2="576" y2="344" stroke="#17212b" stroke-width="2"/><line x1="576" y1="344" x2="592" y2="352" stroke="#17212b" stroke-width="2"/><text x="618" y="358" text-anchor="start" font-family="Arial" font-size="18">R2</text><text x="618" y="386" text-anchor="start" font-family="Arial" font-size="18">10k</text><line x1="832" y1="408" x2="832" y2="416" stroke="#17212b" stroke-width="2"/><line x1="816" y1="400" x2="832" y2="408" stroke="#17212b" stroke-width="2"/><line x1="848" y1="384" x2="816" y2="400" stroke="#17212b" stroke-width="2"/><line x1="816" y1="368" x2="848" y2="384" stroke="#17212b" stroke-width="2"/><line x1="848" y1="352" x2="816" y2="368" stroke="#17212b" stroke-width="2"/><line x1="832" y1="336" x2="832" y2="344" stroke="#17212b" stroke-width="2"/><line x1="832" y1="344" x2="848" y2="352" stroke="#17212b" stroke-width="2"/><text x="874" y="358" text-anchor="start" font-family="Arial" font-size="18">RLOAD</text><text x="874" y="386" text-anchor="start" font-family="Arial" font-size="18">100k</text><text x="128" y="292" font-family="Arial" font-size="18" fill="#244b83">VIN</text><line x1="116" y1="448" x2="140" y2="448" stroke="#244b83" stroke-width="2"/><line x1="120" y1="453" x2="136" y2="453" stroke="#244b83" stroke-width="2"/><line x1="124" y1="458" x2="132" y2="458" stroke="#244b83" stroke-width="2"/><text x="832" y="132" font-family="Arial" font-size="18" fill="#244b83">VOUT</text><line x1="564" y1="464" x2="588" y2="464" stroke="#244b83" stroke-width="2"/><line x1="568" y1="469" x2="584" y2="469" stroke="#244b83" stroke-width="2"/><line x1="572" y1="474" x2="580" y2="474" stroke="#244b83" stroke-width="2"/><line x1="820" y1="464" x2="844" y2="464" stroke="#244b83" stroke-width="2"/><line x1="824" y1="469" x2="840" y2="469" stroke="#244b83" stroke-width="2"/><line x1="828" y1="474" x2="836" y2="474" stroke="#244b83" stroke-width="2"/><text x="64" y="672" font-family="Arial" font-size="18">.tran 0 1m 0 1u</text><text x="64" y="720" font-family="Arial" font-size="18">Without a load VOUT = 2.5 V. With RLOAD = 100k, VOUT is about 2.38 V.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled VOUT (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Click the VIN wire too, to compare input and output in the same plot.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">TRY: Change RLOAD from 100k to 10k, then 1k.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">FAQ: The lower divider resistor is in parallel with the load.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">Lower load resistance pulls VOUT below the unloaded 2.5 V.</text><text x="64" y="1184" font-family="Arial" font-size="18" fill="#17212b">TRY: Change R1 and R2 together from 10k to 1k; loading error gets smaller.</text><text x="64" y="1224" font-family="Arial" font-size="18" fill="#17212b">The trade-off is increased divider current and power consumption.</text></svg>