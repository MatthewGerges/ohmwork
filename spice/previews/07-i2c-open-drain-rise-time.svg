"360" y2="389" stroke="#244b83" stroke-width="2"/><line x1="348" y1="394" x2="356" y2="394" stroke="#244b83" stroke-width="2"/><text x="352" y="420" font-family="Arial" font-size="18" fill="#244b83">CTRL</text><text x="128" y="452" font-family="Arial" font-size="18" fill="#244b83">CTRL</text><line x1="116" y1="608" x2="140" y2="608" stroke="#244b83" stroke-width="2"/><line x1="120" y1="613" x2="136" y2="613" stroke="#244b83" stroke-width="2"/><line x1="124" y1="618" x2="132" y2="618" stroke="#244b83" stroke-width="2"/><text x="64" y="672" font-family="Arial" font-size="18">.model SWOD SW(Ron=0.1 Roff=1G Vt=2 Vh=0.1) ; .tran 0 40u 0 10n</text><text x="64" y="720" font-family="Arial" font-size="18">Plot V(SDA). Released bus: tau = 4.7k x 200p = 0.94 us.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled SDA (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Look for a fast fall to 0 V and a curved rise toward 3.3 V.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">TRY: Change CBUS from 200p to 400p; predict a slower rise.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">TRY: Change RPULLUP from 4.7k to 2.2k; predict a faster rise.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">FAQ: The pull-up charges CBUS after the switch releases the line.</text><text x="64" y="1184" font-family="Arial" font-size="18" fill="#17212b">A smaller pull-up also increases current while the line is held low.</text></svg>