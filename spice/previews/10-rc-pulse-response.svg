<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="white"/><text x="64" y="45" font-family="Arial" font-size="24" fill="#17212b">RC low-pass: pulse response</text><line x1="128" y1="304" x2="128" y2="336" stroke="#244b83" stroke-width="2"/><line x1="128" y1="416" x2="128" y2="448" stroke="#244b83" stroke-width="2"/><line x1="128" y1="304" x2="128" y2="144" stroke="#244b83" stroke-width="2"/><line x1="128" y1="144" x2="384" y2="144" stroke="#244b83" stroke-width="2"/><line x1="464" y1="144" x2="832" y2="144" stroke="#244b83" stroke-width="2"/><line x1="672" y1="144" x2="672" y2="336" stroke="#244b83" stroke-width="2"/><line x1="672" y1="400" x2="672" y2="448" stroke="#244b83" stroke-width="2"/><line x1="120" y1="356" x2="136" y2="356" stroke="#17212b" stroke-width="2"/><line x1="120" y1="396" x2="136" y2="396" stroke="#17212b" stroke-width="2"/><line x1="128" y1="348" x2="128" y2="364" stroke="#17212b" stroke-width="2"/><line x1="128" y1="416" x2="128" y2="408" stroke="#17212b" stroke-width="2"/><line x1="128" y1="336" x2="128" y2="344" stroke="#17212b" stroke-width="2"/><circle cx="128" cy="376" r="32" fill="none" stroke="#17212b" stroke-width="2"/><text x="170" y="358" text-anchor="start" font-family="Arial" font-size="18">V1</text><text x="170" y="386" text-anchor="start" font-family="Arial" font-size="18">PULSE(0 3.3 1m 1u 1u 1m 2m)</text><line x1="392" y1="144" x2="384" y2="144" stroke="#17212b" stroke-width="2"/><line x1="400" y1="128" x2="392" y2="144" stroke="#17212b" stroke-width="2"/><line x1="416" y1="160" x2="400" y2="128" stroke="#17212b" stroke-width="2"/><line x1="432" y1="128" x2="416" y2="160" stroke="#17212b" stroke-width="2"/><line x1="448" y1="160" x2="432" y2="128" stroke="#17212b" stroke-width="2"/><line x1="464" y1="144" x2="456" y2="144" stroke="#17212b" stroke-width="2"/><line x1="456" y1="144" x2="448" y2="160" stroke="#17212b" stroke-width="2"/><text x="424" y="116" text-anchor="middle" font-family="Arial" font-size="18">R1</text><text x="424" y="186" text-anchor="middle" font-family="Arial" font-size="18">1k</text><line x1="672" y1="372" x2="672" y2="400" stroke="#17212b" stroke-width="2"/><line x1="672" y1="364" x2="672" y2="336" stroke="#17212b" stroke-width="2"/><line x1="656" y1="364" x2="688" y2="364" stroke="#17212b" stroke-width="2"/><line x1="656" y1="372" x2="688" y2="372" stroke="#17212b" stroke-width="2"/><text x="714" y="358" text-anchor="start" font-family="Arial" font-size="18">C1</text><text x="714" y="386" text-anchor="start" font-family="Arial" font-size="18">100n</text><text x="128" y="292" font-family="Arial" font-size="18" fill="#244b83">VIN</text><line x1="116" y1="448" x2="140" y2="448" stroke="#244b83" stroke-width="2"/><line x1="120" y1="453" x2="136" y2="453" stroke="#244b83" stroke-width="2"/><line x1="124" y1="458" x2="132" y2="458" stroke="#244b83" stroke-width="2"/><text x="832" y="132" font-family="Arial" font-size="18" fill="#244b83">VOUT</text><line x1="660" y1="448" x2="684" y2="448" stroke="#244b83" stroke-width="2"/><line x1="664" y1="453" x2="680" y2="453" stroke="#244b83" stroke-width="2"/><line x1="668" y1="458" x2="676" y2="458" stroke="#244b83" stroke-width="2"/><text x="64" y="672" font-family="Arial" font-size="18">.tran 0 6m 0 1u</text><text x="64" y="720" font-family="Arial" font-size="18">tau = R1*C1 = 100 us. Compare input edges with the capacitor voltage.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled VOUT (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Click the VIN wire too, to compare input and output in the same plot.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">TRY: Change C1 from 100n to 200n. Edges become slower.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">Probe VIN and VOUT. The same RC time constant controls rise and fall.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">FAQ: A short pulse can end before the capacitor reaches the high level.</text><text x="64" y="1184" font-family="Arial" font-size="18" fill="#17212b">TRY: Shorten the pulse width from 1m to 100u. Predict the output peak.</text></svg>