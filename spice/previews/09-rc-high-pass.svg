<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="white"/><text x="64" y="45" font-family="Arial" font-size="24" fill="#17212b">RC high-pass filter</text><line x1="128" y1="208" x2="128" y2="240" stroke="#244b83" stroke-width="2"/><line x1="128" y1="320" x2="128" y2="352" stroke="#244b83" stroke-width="2"/><line x1="128" y1="208" x2="128" y2="144" stroke="#244b83" stroke-width="2"/><line x1="128" y1="144" x2="320" y2="144" stroke="#244b83" stroke-width="2"/><line x1="384" y1="144" x2="768" y2="144" stroke="#244b83" stroke-width="2"/><line x1="576" y1="144" x2="576" y2="272" stroke="#244b83" stroke-width="2"/><line x1="576" y1="352" x2="576" y2="416" stroke="#244b83" stroke-width="2"/><line x1="120" y1="260" x2="136" y2="260" stroke="#17212b" stroke-width="2"/><line x1="120" y1="300" x2="136" y2="300" stroke="#17212b" stroke-width="2"/><line x1="128" y1="252" x2="128" y2="268" stroke="#17212b" stroke-width="2"/><line x1="128" y1="320" x2="128" y2="312" stroke="#17212b" stroke-width="2"/><line x1="128" y1="240" x2="128" y2="248" stroke="#17212b" stroke-width="2"/><circle cx="128" cy="280" r="32" fill="none" stroke="#17212b" stroke-width="2"/><text x="170" y="262" text-anchor="start" font-family="Arial" font-size="18">V1</text><text x="170" y="290" text-anchor="start" font-family="Arial" font-size="18">AC 1</text><line x1="348" y1="144" x2="320" y2="144" stroke="#17212b" stroke-width="2"/><line x1="356" y1="144" x2="384" y2="144" stroke="#17212b" stroke-width="2"/><line x1="356" y1="128" x2="356" y2="160" stroke="#17212b" stroke-width="2"/><line x1="348" y1="128" x2="348" y2="160" stroke="#17212b" stroke-width="2"/><text x="360" y="116" text-anchor="middle" font-family="Arial" font-size="18">C1</text><text x="360" y="186" text-anchor="middle" font-family="Arial" font-size="18">100n</text><line x1="576" y1="344" x2="576" y2="352" stroke="#17212b" stroke-width="2"/><line x1="560" y1="336" x2="576" y2="344" stroke="#17212b" stroke-width="2"/><line x1="592" y1="320" x2="560" y2="336" stroke="#17212b" stroke-width="2"/><line x1="560" y1="304" x2="592" y2="320" stroke="#17212b" stroke-width="2"/><line x1="592" y1="288" x2="560" y2="304" stroke="#17212b" stroke-width="2"/><line x1="576" y1="272" x2="576" y2="280" stroke="#17212b" stroke-width="2"/><line x1="576" y1="280" x2="592" y2="288" stroke="#17212b" stroke-width="2"/><text x="618" y="294" text-anchor="start" font-family="Arial" font-size="18">R1</text><text x="618" y="322" text-anchor="start" font-family="Arial" font-size="18">1k</text><text x="128" y="196" font-family="Arial" font-size="18" fill="#244b83">VIN</text><line x1="116" y1="352" x2="140" y2="352" stroke="#244b83" stroke-width="2"/><line x1="120" y1="357" x2="136" y2="357" stroke="#244b83" stroke-width="2"/><line x1="124" y1="362" x2="132" y2="362" stroke="#244b83" stroke-width="2"/><line x1="564" y1="416" x2="588" y2="416" stroke="#244b83" stroke-width="2"/><line x1="568" y1="421" x2="584" y2="421" stroke="#244b83" stroke-width="2"/><line x1="572" y1="426" x2="580" y2="426" stroke="#244b83" stroke-width="2"/><text x="768" y="132" font-family="Arial" font-size="18" fill="#244b83">VOUT</text><text x="64" y="672" font-family="Arial" font-size="18">.ac dec 200 10 1Meg</text><text x="64" y="720" font-family="Arial" font-size="18">R1 = 1k, C1 = 100n: cutoff about 1.59 kHz.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled VOUT (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Read the response: frequency on X, gain in dB on Y.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">TRY: Double C1. The high-pass cutoff moves lower.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">WHY: At low frequency C1 has large impedance; at high frequency it passes signal.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">Probe VIN and VOUT; the passband tends to 0 dB with this ideal source.</text></svg>