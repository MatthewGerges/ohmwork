VCC</text><text x="1050" y="274" text-anchor="start" font-family="Arial" font-size="18">12</text><line x1="1000" y1="468" x2="1016" y2="468" stroke="#17212b" stroke-width="2"/><line x1="1000" y1="508" x2="1016" y2="508" stroke="#17212b" stroke-width="2"/><line x1="1008" y1="460" x2="1008" y2="476" stroke="#17212b" stroke-width="2"/><line x1="1008" y1="528" x2="1008" y2="520" stroke="#17212b" stroke-width="2"/><line x1="1008" y1="448" x2="1008" y2="456" stroke="#17212b" stroke-width="2"/><circle cx="1008" cy="488" r="32" fill="none" stroke="#17212b" stroke-width="2"/><text x="1050" y="470" text-anchor="start" font-family="Arial" font-size="18">VEE</text><text x="1050" y="498" text-anchor="start" font-family="Arial" font-size="18">-12</text><text x="608" y="180" font-family="Arial" font-size="18" fill="#244b83">VP</text><text x="608" y="308" font-family="Arial" font-size="18" fill="#244b83">VN</text><text x="128" y="292" font-family="Arial" font-size="18" fill="#244b83">VIN</text><line x1="116" y1="448" x2="140" y2="448" stroke="#244b83" stroke-width="2"/><line x1="120" y1="453" x2="136" y2="453" stroke="#244b83" stroke-width="2"/><line x1="124" y1="458" x2="132" y2="458" stroke="#244b83" stroke-width="2"/><text x="848" y="244" font-family="Arial" font-size="18" fill="#244b83">VOUT</text><line x1="836" y1="480" x2="860" y2="480" stroke="#244b83" stroke-width="2"/><line x1="840" y1="485" x2="856" y2="485" stroke="#244b83" stroke-width="2"/><line x1="844" y1="490" x2="852" y2="490" stroke="#244b83" stroke-width="2"/><text x="480" y="164" font-family="Arial" font-size="18" fill="#244b83">VFB</text><line x1="532" y1="272" x2="556" y2="272" stroke="#244b83" stroke-width="2"/><line x1="536" y1="277" x2="552" y2="277" stroke="#244b83" stroke-width="2"/><line x1="540" y1="282" x2="548" y2="282" stroke="#244b83" stroke-width="2"/><text x="1008" y="180" font-family="Arial" font-size="18" fill="#244b83">VP</text><line x1="996" y1="336" x2="1020" y2="336" stroke="#244b83" stroke-width="2"/><line x1="1000" y1="341" x2="1016" y2="341" stroke="#244b83" stroke-width="2"/><line x1="1004" y1="346" x2="1012" y2="346" stroke="#244b83" stroke-width="2"/><text x="1008" y="404" font-family="Arial" font-size="18" fill="#244b83">VN</text><line x1="996" y1="560" x2="1020" y2="560" stroke="#244b83" stroke-width="2"/><line x1="1000" y1="565" x2="1016" y2="565" stroke="#244b83" stroke-width="2"/><line x1="1004" y1="570" x2="1012" y2="570" stroke="#244b83" stroke-width="2"/><text x="64" y="672" font-family="Arial" font-size="18">.tran 0 5m 0 1u</text><text x="64" y="720" font-family="Arial" font-size="18">Plot V(VIN) and V(VOUT). Supplies are separate from the signal path.</text><rect x="48" y="750" width="1104" height="180" rx="4" fill="#edf4fa" stroke="#b6c9db"/><text x="64" y="784" font-family="Arial" font-size="18" fill="#17212b">1. Click Run: the running-person button at the top left.</text><text x="64" y="824" font-family="Arial" font-size="18" fill="#17212b">2. On the schematic, click the wire labeled VOUT (not the component).</text><text x="64" y="864" font-family="Arial" font-size="18" fill="#17212b">3. Click the VIN wire too, to compare input and output in the same plot.</text><text x="64" y="904" font-family="Arial" font-size="18" fill="#17212b">If the plot is empty, select the schematic window and click the labeled wire again.</text><rect x="48" y="950" width="1104" height="420" rx="4" fill="#f2f6ef" stroke="#c4d2bc"/><text x="64" y="984" font-family="Arial" font-size="18" fill="#17212b">EXPERIMENTS AND COMMON QUESTIONS</text><text x="64" y="1024" font-family="Arial" font-size="18" fill="#17212b">Right-click a component to edit its value. Predict first, change one value, then Run.</text><text x="64" y="1064" font-family="Arial" font-size="18" fill="#17212b">TRY: Change RF from 100k to 200k. Predict gain = -RF/RIN.</text><text x="64" y="1104" font-family="Arial" font-size="18" fill="#17212b">TRY: Increase input amplitude from 0.15 V to 2 V; observe clipping.</text><text x="64" y="1144" font-family="Arial" font-size="18" fill="#17212b">FAQ: Clipping flattens the sine when the requested output exceeds the rails.</text><text x="64" y="1184" font-family="Arial" font-size="18" fill="#17212b">TRY: Reduce RLOAD to 100 ohms: output-current limits can distort the signal.</text><text x="64" y="1224" font-family="Arial" font-size="18" fill="#17212b">A heavier load means LOWER resistance, not higher resistance.</text></svg>